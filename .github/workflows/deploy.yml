# Publishes the page to GitHub Pages on every push to main.
#
# No build step: the repo is the site. That is the point — this page has to go
# up when other things are down, so there is nothing to install, nothing to
# compile and nothing that can fail but the upload.
#
# `enablement: true` turns Pages on for the repository if it is off, so there
# is no setting to remember. If that step fails with "Get Pages site failed",
# the workflow's token is not allowed to enable it and someone has to set
# Settings -> Pages -> Source: "GitHub Actions" by hand, once.
name: Deploy

on:
  push:
    branches: [main]
  # So the page can be republished from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede one in flight, but never cancel a deploy
# half-done: the page would be left in whatever state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off, so a fresh clone of this repo deploys
          # without anyone opening Settings. In an incident the fewer manual
          # steps between a commit and a live page the better.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The repository root, minus what the action excludes itself.
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
